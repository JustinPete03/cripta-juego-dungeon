[pytest]
# El proyecto escribe sus archivos de prueba en camelCase (TestMotor.py, PruebaRetroceso.py,
# pruebaEfectos.py); sin estos patrones pytest no los recoge y la mitad de la suite no se ejecuta.
python_files = test_*.py Test*.py Prueba*.py prueba*.py Diario*.py
python_classes = Test* Prueba*
testpaths = tests
